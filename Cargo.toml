[workspace]
members = [
    "libraries/*",
    "binaries/*",
    "learnopengl/*/*"
]
resolver = "2"

[workspace.dependencies]
gl_bindings = { path = "libraries/gl_bindings" }
gl_bindings_raw_handle_derive = { path = "libraries/gl_bindings_raw_handle_derive" }
opengl-rs = { git = "https://github.com/platc2/opengl-rs" }
renderer = { path = "libraries/renderer" }
sdl2 = { version = "0.38.0", features = ["static-link", "use-vcpkg"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
walkdir = "2.5.0"
nalgebra-glm = "0.20.0"
imgui = "0.12.0"
noise = "0.9.0"
stb_image = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
russimp = { version = "3.2.1", features = ["prebuilt"] }
learnopengl-utils = { path = "libraries/learnopengl-utils" }
